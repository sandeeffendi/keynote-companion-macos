name: Upload TestFlight Build

on:
  push:
    branches:
      - main-cicd

jobs:
  testflight:
    runs-on: macos-26
    env:
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ruby dependencies
        run: bundle install

      - name: Install signing certificates
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.INSTALLER_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: temp_ci_keychain_password
        run: |
          DIST_CERT_PATH="$RUNNER_TEMP/distribution.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/installer.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$DIST_CERT_PATH"
          printf '%s' "$INSTALLER_CERTIFICATE_BASE64" | base64 --decode > "$INSTALLER_CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          security import "$DIST_CERT_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_CERT_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          echo "Codesigning identities found after import:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          IDENTITY_COUNT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c 'Apple Distribution' || true)
          if [ "$IDENTITY_COUNT" -eq 0 ]; then
            echo "::error::No valid 'Apple Distribution' codesigning identity in the keychain after import."
            echo "::error::BUILD_CERTIFICATE_BASE64 almost certainly holds a certificate WITHOUT its private key (cert-only .p12)."
            echo "::error::Re-export a .p12 that INCLUDES the private key (Keychain Access > My Certificates > select the identity > Export as .p12), then update the secret. Verify locally: openssl pkcs12 -in cert.p12 -nodes -passin pass:PW | grep -i 'PRIVATE KEY'"
            echo "--- All codesigning certs in keychain (including invalid, for debugging): ---"
            security find-identity -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/profile.provisionprofile"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          UUID=$(plutil -extract UUID raw -o - "$PROFILE_PLIST")
          NAME=$(plutil -extract Name raw -o - "$PROFILE_PLIST")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.provisionprofile"
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Verify Code Signing
        run: security find-identity -v -p codesigning

      - name: Xcode Version
        run: xcodebuild -version

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bundle exec fastlane beta
